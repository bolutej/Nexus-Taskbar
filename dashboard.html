<!DOCTYPE html>

    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Only keeping styles that can't be done in Tailwind */
      .tab.active { border-bottom: 2px solid #0F0C29; color: #0F0C29; }
      .column-body.drag-over { background: #eef2ff !important; border-color: #818cf8 !important; }
      .task-card.dragging { opacity: 0.5; cursor: grabbing; }
      .task-card:hover { transform: translateY(-1px); }
      .tag-option { opacity: 0.4; }
      .tag-option.selected { opacity: 1; border: 1px solid currentColor; }
      .modal-backdrop { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
      .modal-backdrop.open { opacity: 1; pointer-events: all; }
      .modal { transform: scale(0.95) translateY(10px); transition: transform 0.22s; }
      .modal-backdrop.open .modal { transform: scale(1) translateY(0); }
      .toast { transform: translateX(-50%) translateY(8px); opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .tag-frontend { background: #ede9fe; color: #5b21b6; }
      .tag-design { background: #fce7f3; color: #9d174d; }
      .tag-backend { background: #d1fae5; color: #065f46; }
      .tag-bug { background: #fee2e2; color: #991b1b; }
      .tag-feature { background: #dbeafe; color: #1e40af; }
      .tag-docs { background: #fef9c3; color: #854d0e; }
      .task-id-icon.done { background: #d1fae5; color: #065f46; }
      .task-id-icon.todo { background: #f4f5f7; color: #5e6c84; }
      .task-id-icon.progress { background: #dbeafe; color: #1e40af; }
      .priority-high { color: #ef4444; }
      .priority-medium { color: #f59e0b; }
      .priority-low { color: #10b981; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
    </style>
  </head>
  <body

      <div

        <svg

        <!-- <button
          class="inline-flex h-[38px] items-center gap-[0.45rem] rounded-[6px] bg-[#0F0C29] px-4 text-[0.88rem] font-semibold text-white transition-all duration-150 ease-in-out hover:bg-[#0747a6] max-[960px]:h-[34px]"

        </button> -->
        <button

            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
          </svg>
        </button>
        <button
          class="inline-flex h-[38px] w-[38px] items-center justify-center rounded-full text-[#5e6c84] transition-all duration-150 ease-in-out hover:bg-[#ebecf0] hover:text-[#172b4d] max-[960px]:h-[34px] max-[960px]:w-[34px]"

          <svg

            <path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 2-3 4" />
            <path d="M12 17h.01" />
          </svg>
        </button>
        <div

          aria-label="Account"
        >

      </div>
    </nav>

    <header
      class="mx-6 mt-4 flex flex-wrap items-center justify-between gap-5 rounded-[12px] bg-white px-6 py-[1.1rem] shadow-[0_1px_1px_rgba(9,30,66,0.04),0_0_0_1px_rgba(9,30,66,0.04)] max-[960px]:mx-[0.6rem]"
    >
      <div class="min-w-0">
        <p class="mb-1 text-[0.7rem] font-semibold tracking-[0.12em] text-[#1868db]">
          SPRINT 12 &middot; NEX BOARD
        </p>
        <h1 class="m-0 text-[1.4rem] font-bold tracking-[-0.018em] text-[#0F0C29]">
          Product Design Sprint
        </h1>
        <p class="mt-[0.3rem] text-[0.84rem] text-[#5e6c84]">
          <span id="taskSummary">&mdash; in progress</span> &middot; Last updated
          <span id="lastUpdated">just now</span>
        </p>
      </div>

      <div class="inline-flex flex-wrap items-center gap-[0.4rem]">
        <button
          class="inline-flex h-9 items-center gap-[0.45rem] rounded-[6px] border border-transparent bg-[#f4f5f7] px-[0.9rem] text-[0.84rem] font-medium text-[#172b4d] transition-all duration-150 ease-in-out hover:bg-[#ebecf0]"
          type="button"
        >
          <span class="mr-[0.15rem] inline-flex" aria-hidden="true">
            <span
              class="member inline-flex h-[22px] w-[22px] items-center justify-center rounded-full border-2 border-white bg-[#FF8F73] text-[0.62rem] font-semibold text-[rgba(9,30,66,0.8)]"
            >
              T
            </span>
            <span
              class="member -ml-[7px] inline-flex h-[22px] w-[22px] items-center justify-center rounded-full border-2 border-white bg-[#FFC400] text-[0.62rem] font-semibold text-[rgba(9,30,66,0.8)]"
            >
              A
            </span>
            <span
              class="member -ml-[7px] inline-flex h-[22px] w-[22px] items-center justify-center rounded-full border-2 border-white bg-[#36B37E] text-[0.62rem] font-semibold text-[rgba(9,30,66,0.8)]"
            >
              M
            </span>
            <span
              class="member -ml-[7px] inline-flex h-[22px] w-[22px] items-center justify-center rounded-full border-2 border-white bg-[#6554C0] text-[0.62rem] font-semibold text-[rgba(9,30,66,0.8)]"
            >
              K
            </span>
          </span>
          4 members
        </button>
        <button
          class="inline-flex h-9 items-center gap-[0.45rem] rounded-[6px] border border-transparent bg-[#f4f5f7] px-[0.9rem] text-[0.84rem] font-medium text-[#172b4d] transition-all duration-150 ease-in-out hover:bg-[#ebecf0]"
          type="button"
        >
          <svg
            class="text-[#5e6c84]"
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 5h18l-7 9v6l-4-2v-4L3 5z" />
          </svg>
          Filter
        </button>
        <button
          class="inline-flex h-9 items-center gap-[0.45rem] rounded-[6px] border border-transparent bg-[#f4f5f7] px-[0.9rem] text-[0.84rem] font-medium text-[#172b4d] transition-all duration-150 ease-in-out hover:bg-[#ebecf0]"
          type="button"
          id="addTaskBtn"
        >
          <svg
            class="text-[#5e6c84]"
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
          Add Task
        </button>
        <button
          class="inline-flex h-9 items-center gap-[0.45rem] rounded-[6px] border border-transparent bg-[#f4f5f7] px-[0.9rem] text-[0.84rem] font-medium text-[#172b4d] transition-all duration-150 ease-in-out hover:bg-[#ebecf0]"
          type="button"
        >
          <svg
            class="text-[#5e6c84]"
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <path d="M8.6 13.5 15.4 17.5M15.4 6.5 8.6 10.5" />
          </svg>
          Share
        </button>
        <button

          type="button"
          aria-label="More"
        >
          <svg
            class="text-[#5e6c84]"
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="5" cy="12" r="1.2" />
            <circle cx="12" cy="12" r="1.2" />
            <circle cx="19" cy="12" r="1.2" />
          </svg>
        </button>
      </div>
    </header>
    <section id="board" class="flex gap-4 px-6 pt-4 pb-8 overflow-x-auto min-h-[calc(100vh-160px)] items-start">

      <div class="flex-none w-[608px] min-w-[280px] flex flex-col">
        <div class="flex items-center justify-between px-3 py-2.5 ">
          <div class="flex items-center gap-2">
            <!-- <div class="w-2 h-2 rounded-full bg-slate-400"></div> -->
            <span class="text-[0.82rem] font-semibold text-[#172b4d] uppercase tracking-[0.05em]">Backlog</span>
            <span id="count-backlog" class="text-[0.75rem] bg-[#DFE1E6] text-[#5e6c84] px-1.5 py-px rounded-full font-medium">0</span>
          </div>
          <button class="column-add-btn w-[26px] h-[26px] rounded-md border-none bg-transparent text-[#97a0af] cursor-pointer flex items-center justify-center text-lg hover:bg-[#f4f5f7] hover:text-[#172b4d] transition-colors" data-col="backlog">+</button>
        </div>
        <div id="body-backlog" class="column-body bg-[#f8f9fb] border border-[#e8eaed] border-t-0 rounded-b-[10px] p-2 min-h-[200px] flex flex-col gap-2" data-col="backlog"></div>
      </div>

      <div class="flex-none w-[608px] min-w-[280px] flex flex-col">
        <div class="flex items-center justify-between px-3 py-2.5">
          <div class="flex items-center gap-2">
            <!-- <div class="w-2 h-2 rounded-full bg-indigo-400"></div> -->
            <span class="text-[0.82rem] font-semibold text-[#172b4d] uppercase tracking-[0.05em]">In Progress</span>
            <span id="count-inprogress" class="text-[0.75rem] bg-[#DFE1E6] text-[#5e6c84] px-1.5 py-px rounded-full font-medium">0</span>
          </div>
          <button class="column-add-btn w-[26px] h-[26px] rounded-md border-none bg-transparent text-[#97a0af] cursor-pointer flex items-center justify-center text-lg hover:bg-[#f4f5f7] hover:text-[#172b4d] transition-colors" data-col="inprogress">+</button>
        </div>
        <div id="body-inprogress" class="column-body bg-[#f8f9fb] border border-[#e8eaed] border-t-0 rounded-b-[10px] p-2 min-h-[200px] flex flex-col gap-2" data-col="inprogress"></div>
      </div>

      <div class="flex-none w-[608px] min-w-[280px] flex flex-col">
        <div class="flex items-center justify-between px-3 py-2.5 ">
          <div class="flex items-center gap-2">
            <!-- <div class="w-2 h-2 rounded-full bg-emerald-400"></div> -->
            <span class="text-[0.82rem] font-semibold text-[#172b4d] uppercase tracking-[0.05em]">Done</span>
            <span id="count-done" class="text-[0.75rem] bg-[#DFE1E6] text-[#5e6c84] px-1.5 py-px rounded-full font-medium">0</span>
          </div>
          <button class="column-add-btn w-[26px] h-[26px] rounded-md border-none bg-transparent text-[#97a0af] cursor-pointer flex items-center justify-center text-lg hover:bg-[#f4f5f7] hover:text-[#172b4d] transition-colors" data-col="done">+</button>
        </div>
        <div id="body-done" class="column-body bg-[#f8f9fb] border border-[#e8eaed] border-t-0 rounded-b-[10px] p-2 min-h-[200px] flex flex-col gap-2" data-col="done"></div>
      </div>

    </section>
    
    <!-- modal backdrop -->
    <div
      class=" modal-backdrop fixed inset-0 z-[100] hidden items-start justify-center overflow-y-auto px-6 pb-8 pt-16 aria-[hidden=false]:flex aria-[hidden=false]:animate-[fade_180ms_ease_both] max-[960px]:p-4"
      id="modal-backdrop"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
    >
      <div class="fixed inset-0 bg-[rgba(9,30,66,0.55)] backdrop-blur-[4px]" data-close></div>
      <div
        class="modal relative flex max-h-[calc(100vh-6rem)] w-full max-w-[820px] flex-col overflow-hidden rounded-[12px] bg-white shadow-[0_16px_40px_rgba(9,30,66,0.18)] animate-[pop_200ms_cubic-bezier(0.2,0.8,0.2,1.05)_both]"
        id="modal"
        role="document"
      >
        <header class="flex items-center justify-between border-b border-[#dfe1e6] px-5 py-[0.85rem] pr-4">
          <div class="inline-flex items-center gap-2">
            <span
              class="type-icon inline-flex h-[14px] w-[14px] shrink-0 items-center justify-center rounded-[3px] text-[9px] text-white data-[type=task]:bg-[#1868db] data-[type=story]:bg-[#36b37e] data-[type=bug]:rounded-full data-[type=bug]:bg-[#de350b]"
              id="modalTypeIcon"
            ></span>
            <span
              class="text-[0.84rem] font-semibold tracking-[0.02em] text-[#5e6c84]"
              id="modalKey"
            >
              NEX-0
            </span>
          </div>
          <button
            class="inline-flex h-8 w-8 items-center justify-center rounded-full text-[#5e6c84] transition-all duration-150 ease-in-out hover:bg-[#ebecf0] hover:text-[#172b4d]"
            id="modal-close"
            type="button"
            aria-label="Close"
            data-close
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </header>

        <div class="grid grid-cols-[1.6fr_minmax(0,1fr)] gap-6 overflow-y-auto px-6 py-5 max-[960px]:grid-cols-1 max-[960px]:gap-4 max-[960px]:p-4">
          <div class="min-w-0">
            <input
              class="-mx-[0.55rem] mb-3 w-[calc(100%+1.1rem)] rounded-[6px] border border-transparent bg-transparent px-[0.55rem] py-[0.4rem] text-[1.4rem] font-bold tracking-[-0.015em] text-[#172b4d] outline-none transition-all duration-150 ease-in-out hover:bg-[#f4f5f7] focus:border-[#1868db] focus:bg-white focus:ring-2 focus:ring-[rgba(24,104,219,0.18)]"
              id="task-title-input"
              type="text"
              placeholder="Issue title"
            />

            <section class="mt-4">
              <p class="mb-[0.4rem] text-[0.72rem] font-bold uppercase tracking-[0.06em] text-[#5e6c84]">
                Description
              </p>
              <textarea
                class="min-h-[90px] w-full resize-y rounded-[6px] border border-transparent bg-[#f4f5f7] px-[0.8rem] py-[0.7rem] text-[0.92rem] leading-[1.55] text-[#172b4d] outline-none transition-all duration-150 ease-in-out hover:bg-[#ebecf0] focus:border-[#1868db] focus:bg-white focus:ring-2 focus:ring-[rgba(24,104,219,0.18)]"
                id="modalDesc"
                rows="5"
                placeholder="Add a description..."
              ></textarea>
            </section>
          </div>

          <aside class="self-start rounded-[8px] border border-[#dfe1e6] bg-[#fafbfc] px-4 pb-4 pt-[0.85rem]">
            <p class="mb-[0.65rem] text-[0.7rem] font-bold uppercase tracking-[0.08em] text-[#5e6c84]">
              Details
            </p>

            <div class="grid grid-cols-[80px_minmax(0,1fr)] items-center gap-2 border-b border-[#dfe1e6] py-2">
              <span class="text-[0.78rem] font-semibold text-[#5e6c84]">Status</span>
              <select
                class="detail-input w-full cursor-pointer appearance-none rounded-[6px] border border-transparent bg-transparent px-2 py-[0.35rem] pr-6 text-[0.84rem] text-[#172b4d] outline-none transition-all duration-150 ease-in-out hover:bg-[#ebecf0] focus:border-[#1868db] focus:bg-white focus:ring-2 focus:ring-[rgba(24,104,219,0.18)]"
                id="task-col-select"
              ></select>
            </div>

            <div class="grid grid-cols-[80px_minmax(0,1fr)] items-center gap-2 border-b border-[#dfe1e6] py-2">
              <span class="text-[0.78rem] font-semibold text-[#5e6c84]">Priority</span>
              <select
                class="detail-input w-full cursor-pointer appearance-none rounded-[6px] border border-transparent bg-transparent px-2 py-[0.35rem] pr-6 text-[0.84rem] text-[#172b4d] outline-none transition-all duration-150 ease-in-out hover:bg-[#ebecf0] focus:border-[#1868db] focus:bg-white focus:ring-2 focus:ring-[rgba(24,104,219,0.18)]"

              >
                <option value="highest">&uarr;&uarr; Highest</option>
                <option value="high">&uarr; High</option>
                <option value="medium">= Medium</option>
                <option value="low">&darr; Low</option>
                <option value="lowest">&darr;&darr; Lowest</option>

            </div>

            <div class="grid grid-cols-[80px_minmax(0,1fr)] items-center gap-2 border-b border-[#dfe1e6] py-2">
              <span class="text-[0.78rem] font-semibold text-[#5e6c84]">Type</span>
              <select
                class="detail-input w-full cursor-pointer appearance-none rounded-[6px] border border-transparent bg-transparent px-2 py-[0.35rem] pr-6 text-[0.84rem] text-[#172b4d] outline-none transition-all duration-150 ease-in-out hover:bg-[#ebecf0] focus:border-[#1868db] focus:bg-white focus:ring-2 focus:ring-[rgba(24,104,219,0.18)]"
                id="modalType"
              >
                <option value="task">Task</option>
                <option value="story">Story</option>
                <option value="bug">Bug</option>
              </select>
            </div>

            <div class="grid grid-cols-[80px_minmax(0,1fr)] items-start gap-2 border-b border-[#dfe1e6] py-2">
              <span class="text-[0.78rem] font-semibold text-[#5e6c84]">Labels</span>
              <div class="label-picker flex flex-wrap gap-[0.3rem]" id="tag-selector"></div>
            </div>

            <div class="grid grid-cols-[80px_minmax(0,1fr)] items-center gap-2 border-b border-[#dfe1e6] py-2">
              <span class="text-[0.78rem] font-semibold text-[#5e6c84]">Assignee</span>
              <div class="inline-flex items-center gap-[0.4rem]">
                <span
                  class="member m-0 inline-flex h-[22px] w-[22px] items-center justify-center rounded-full border-2 border-white bg-[#FF8F73] text-[0.62rem] font-semibold text-[rgba(9,30,66,0.8)]"
                >
                  T
                </span>
                <span class="text-[0.84rem] text-[#172b4d]">You</span>
              </div>
            </div>

            <div class="grid grid-cols-[80px_minmax(0,1fr)] items-center gap-2 py-2">
              <span class="text-[0.78rem] font-semibold text-[#5e6c84]">Created</span>
              <span class="text-[0.82rem] text-[#172b4d]" id="modalCreated">&mdash;</span>
            </div>
          </aside>
        </div>

        <footer class="flex justify-between gap-2 border-t border-[#dfe1e6] bg-[#fafbfc] px-5 py-[0.85rem]">
          <button
            class="inline-flex h-[38px] items-center gap-[0.45rem] rounded-[6px] bg-transparent px-4 text-[0.88rem] font-semibold text-red-700 transition-all duration-150 ease-in-out hover:bg-red-100 hover:text-red-800"
            type="button"
            id="modal-delete"
          >
            Delete
          </button>
          <button
            class="inline-flex h-[38px] items-center gap-[0.45rem] rounded-[6px] bg-[#1868db] px-4 text-[0.88rem] font-semibold text-white transition-all duration-150 ease-in-out hover:bg-[#0747a6]"
            type="button"
            data-close
          >
            Done
          </button>
        </footer>
      </div>
    </div>

    <div id="toast" class="toast fixed bottom-6 left-1/2 bg-[#172b4d] text-white text-[0.82rem] font-medium px-4 py-2.5 rounded-xl flex items-center gap-2 z-[100] whitespace-nowrap shadow-lg">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="toast-msg">Task created!</span>
    </div>

    <script src="./js/dashboard.js" type="module"></script>
  </body>
</html>
