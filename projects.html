<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus &mdash; NEX board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="./src/output.css" rel="stylesheet" />
  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    #modal-backdrop { opacity: 0; transition: opacity 200ms ease;  }
    #modal-backdrop.open { opacity: 1; }
    #modal-panel { opacity: 0; transform: scale(0.95) translateY(10px); transition: opacity 220ms ease, transform 220ms ease; }
    #modal-panel.open { opacity: 1; transform: scale(1) translateY(0); }
    input:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
</style>
</head>

<body
  class="min-h-screen bg-[#f6f7fb] bg-[radial-gradient(900px_600px_at_0%_0%,#e9f2ff_0%,transparent_60%),radial-gradient(900px_600px_at_100%_0%,#eef0f7_0%,transparent_55%),linear-gradient(180deg,#f6f7fb_0%,#eceff5_100%)] bg-fixed font-['Inter'] text-[14px] text-[#172b4d] antialiased">
  <nav
    class="mx-6 mt-4 grid grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-5 rounded-[16px] bg-white px-[1.1rem] py-2 pr-[0.6rem] shadow-[0_4px_12px_rgba(9,30,66,0.1)] max-[960px]:m-[0.6rem] max-[960px]:grid-cols-[auto_auto] max-[960px]:gap-[0.6rem]">
    <div class="inline-flex min-w-0 items-center gap-[0.55rem] pr-2">
      <a href="index.html" class="inline-flex items-center rounded-2xl px-1 py-1 transition hover:opacity-90"
        aria-label="Nexus home">
        <img src="img/nexus_logoo.png" alt="Nexus logo"
          class="h-auto w-[8.5rem] object-contain sm:w-[13rem] lg:w-[11.5rem]" />
      </a>
      <span class="mx-[0.4rem] h-[22px] w-px bg-[#dfe1e6] max-[960px]:hidden" aria-hidden="true"></span>
      <span class="overflow-hidden text-ellipsis whitespace-nowrap text-[0.86rem] max-[960px]:hidden">
        <span class="mr-1 text-[#97a0af]">Projects </span>
      </span>
    </div>

    <div
      class="relative flex h-[38px] items-center rounded-[6px] border border-transparent bg-[#f4f5f7] px-4 pl-[2.4rem] transition-all duration-150 ease-in-out hover:bg-[#ebecf0] focus-within:border-[#1868db] focus-within:bg-white focus-within:ring-2 focus-within:ring-[rgba(24,104,219,0.18)] max-[960px]:order-3 max-[960px]:col-[1/-1] max-[960px]:h-9">
      <svg class="absolute left-[0.85rem] text-[#97a0af]" viewBox="0 0 24 24" width="18" height="18" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input type="search"
        class="h-full w-full border-0 bg-transparent text-[0.88rem] text-[#172b4d] outline-none placeholder:text-[#97a0af]"
        placeholder="Search issues, projects, people..." aria-label="Search" />
    </div>

    <div class="inline-flex items-center gap-[0.4rem] max-[960px]:gap-[0.3rem]">
      <button
        class="inline-flex h-[38px] items-center gap-[0.45rem] rounded-[6px] bg-[#0F0C29] px-4 text-[0.88rem] font-semibold text-white transition-all duration-150 ease-in-out hover:bg-[#0747a6] max-[960px]:h-[34px] mr-35"
       type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        New Project
      </button>
      <button
        class="inline-flex h-[38px] w-[38px] items-center justify-center rounded-full text-[#5e6c84] transition-all duration-150 ease-in-out hover:bg-[#ebecf0] hover:text-[#172b4d] max-[960px]:h-[34px] max-[960px]:w-[34px]"
        type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
      </button>
      <button
        class="inline-flex h-[38px] w-[38px] items-center justify-center rounded-full text-[#5e6c84] transition-all duration-150 ease-in-out hover:bg-[#ebecf0] hover:text-[#172b4d] max-[960px]:h-[34px] max-[960px]:w-[34px]"
        type="button" aria-label="Help">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 2-3 4" />
          <path d="M12 17h.01" />
        </svg>
      </button>
      <div
        class="ml-1 inline-flex h-8 w-8 select-none items-center justify-center rounded-full bg-[linear-gradient(135deg,#ff8f73,#ff5630)] text-[0.82rem] font-semibold text-white"
        aria-label="Account">
        T
      </div>
    </div>
  </nav>
  
  <header
    class="mx-6 mt-3 flex flex-wrap items-center justify-between gap-5 rounded-[12px] bg-white px-6 py-[1.1rem] shadow-[0_1px_1px_rgba(9,30,66,0.04),0_0_0_1px_rgba(9,30,66,0.04)] max-[960px]:mx-[0.6rem]">
    <div class="min-w-0">
      <!-- <p class="mb-1 text-[0.7rem] font-semibold tracking-[0.12em] text-[#1868db]">
          All Projects
        </p> -->
      <h1 class="m-0 text-[1.4rem] font-bold tracking-[-0.018em] text-[#0F0C29]">
        All Projects
      </h1>
      <p class="mt-[0.3rem] text-[0.84rem] text-[#5e6c84]">
        <span id="taskSummary">&mdash; 5 Projects across 2 teams
      </p>
    </div>

    <div class="inline-flex flex-wrap items-center gap-[0.4rem]">
      <button
        class="inline-flex h-9 items-center gap-[0.45rem] rounded-[6px] border border-transparent bg-[#f4f5f7] px-[0.9rem] text-[0.84rem] font-medium text-[#172b4d] transition-all duration-150 ease-in-out hover:bg-[#ebecf0]"
        type="button">
        <svg class="text-[#5e6c84]" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5h18l-7 9v6l-4-2v-4L3 5z" />
        </svg>
        Filter
      </button>
      <button
        class="inline-flex h-9 items-center gap-[0.45rem] rounded-[6px] border border-transparent bg-[#f4f5f7] px-[0.9rem] text-[0.84rem] font-medium text-[#172b4d] transition-all duration-150 ease-in-out hover:bg-[#ebecf0]"
        type="button" id="addTaskBtn">
        Sort
      </button>
      <button
        id="open-modal-btn"
        class="inline-flex h-9 items-center gap-[0.45rem] rounded-[6px] border border-transparent bg-[#f4f5f7] px-[0.9rem] text-[0.84rem] font-medium text-[#172b4d] transition-all duration-150 ease-in-out hover:bg-[#ebecf0]"
        type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        New Project
      </button>
    </div>
  </header>
  <section class="">
    <div
    id="modal-backdrop"
    class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-40 flex items-center justify-center p-4"
    aria-hidden="true"
  >
    <!-- Modal panel -->
    <div
      id="modal-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      class="bg-white w-full max-w-sm rounded-2xl shadow-xl z-50 overflow-hidden"
    >
      <!-- Header -->
      <div class="flex items-start justify-between px-6 pt-6 pb-4 border-b border-slate-100">
        <div>
          <h2 id="modal-title" class="text-lg font-600 text-slate-900" style="font-weight:600;">Create project</h2>
          <p class="text-sm text-slate-500 mt-0.5">Fill in the details to get started</p>
        </div>
        <button
          id="close-modal-btn"
          aria-label="Close modal"
          class="text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg p-1.5 transition-colors -mt-0.5 -mr-1"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
 
      <!-- Form body -->
      <form id="project-form" novalidate class="px-6 py-5 space-y-5">
 
        <!-- Title field -->
        <div>
          <label for="project-title" class="block text-sm font-medium text-slate-700 mb-1.5">
            Project title <span class="text-red-500">*</span>
          </label>
          <input
            id="project-title"
            type="text"
            placeholder="e.g. Website redesign"
            maxlength="80"
            class="w-full h-10 px-3.5 text-sm text-slate-900 placeholder-slate-400 bg-slate-50 border border-slate-200 rounded-xl transition-colors focus:border-indigo-400 focus:bg-white"
          />
          <div class="flex justify-between items-center mt-1.5">
            <p id="title-error" class="text-xs text-red-500 hidden">Please enter a project title.</p>
            <p class="text-xs text-slate-400 ml-auto"><span id="title-count">0</span>/80</p>
          </div>
        </div>
 
        <!-- Description field -->
        <div>
          <label for="project-desc" class="block text-sm font-medium text-slate-700 mb-1.5">
            Description
            <span class="text-slate-400 font-normal ml-1">— optional</span>
          </label>
          <textarea
            id="project-desc"
            rows="4"
            placeholder="What is this project about? What are the goals?"
            maxlength="500"
            class="w-full px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 bg-slate-50 border border-slate-200 rounded-xl resize-none transition-colors focus:border-indigo-400 focus:bg-white leading-relaxed"
          ></textarea>
          <div class="flex justify-between items-center mt-1.5">
            <p class="text-xs text-slate-400">Helps your team understand the project goals</p>
            <div class="flex items-center gap-2">
              <!-- Character bar -->
              <div class="w-16 h-1 bg-slate-200 rounded-full overflow-hidden">
                <div id="desc-bar" class="char-bar-fill h-full bg-indigo-400 rounded-full" style="width:0%"></div>
              </div>
              <p class="text-xs text-slate-400"><span id="desc-count">0</span>/500</p>
            </div>
          </div>
        </div>
 
      </form>
 
      <!-- Footer -->
      <div class="flex items-center justify-end gap-2.5 px-6 py-4 bg-slate-50 border-t border-slate-100">
        <button
          id="cancel-btn"
          type="button"
          class="px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-100 active:scale-95 transition-all duration-150"
        >
          Cancel
        </button>
        <button
          id="submit-btn"
          type="submit"
          form="project-form"
          class="flex items-center gap-1.5 px-5 py-2 text-sm font-medium text-white bg-[#0F0C29] hover:bg-indigo-700 active:scale-95 rounded-xl transition-all duration-150 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create project
        </button>
      </div>
    </div>
  </div>
 
  <!-- Success toast -->
  <div
    id="toast"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 translate-y-2 z-50"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toast-msg">Project created!</span>
  </div>
    
  </section>
  <main id="card" class="mx-6 mt-3 rounded-[12px] bg-white px-6 py-[1.1rem] shadow-[0_1px_1px_rgba(9,30,66,0.04),0_0_0_1px_rgba(9,30,66,0.04)] max-[960px]:mx-[0.6rem]">
    <div class="flex gap-3 px-5 py-2 rounded-lg">
      <button class="border px-5 py-2 rounded-full text-[#4f46e5]"><i class="fa-solid fa-circle pr-1"></i>Active</button>
      <button class="border px-5 py-2 rounded-full text-[#ff8f73]"><i class="fa-solid fa-pause pr-1"></i> Paused</button>
      <button class="border px-5 py-2 rounded-full text-green-500"><i class="fa-solid fa-circle-check pr-1"></i>Done</button>
    </div>

    <div class="bg-[#f6f7fb] rounded-lg px-8 py-5 w-[32%]">
      <div class="flex justify-between">
        <button class="border px-5 py-2 rounded-full text-green-500"><i class="fa-solid fa-circle-check pr-1"></i>Done</button>
      <svg
            class="text-[#5e6c84] mt-3"
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="5" cy="12" r="1.2" />
            <circle cx="12" cy="12" r="1.2" />
            <circle cx="19" cy="12" r="1.2" />
          </svg>
        </div>
        <input
            id="card-title"
            type="text"
            placeholder="Nex Board"
            maxlength="25"
            class="font-bold text-xl pt-3"
            />
            <input
            id="card-desc"
            type="text"
            placeholder="Product Design Sprint "
            maxlength="30"
            class="font-bold text-lg"
            />
      <p id="card-bar" class="pt-2">100% completed</p>
      <div class="flex justify-between pt-10">
      <a href=""><button class="hover:underline">View</button></a>
      <p>14 open issue</p>
    </div>
    </div>
  
  </main>

  <script src="./js/projects.js"></script>
</body>

</html>
